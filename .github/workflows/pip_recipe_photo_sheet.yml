name: One-off PIP recipe photo contact sheet
on:
  push:
    branches: [pip-recipe-photo-contact-sheet]
    paths:
      - scripts/build_recipe_photo_contact_sheet.py
      - .github/workflows/pip_recipe_photo_sheet.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  contact-sheet:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow requests
      - name: Build single offline PNG grid
        run: python scripts/build_recipe_photo_contact_sheet.py
      - name: Commit contact sheet to preview branch
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add previews/PIP_82_Real_Food_Photo_Contact_Sheet.png previews/PIP_82_Photo_Sources.json previews/PIP_82_Real_Food_Photo_Contact_Sheet_Preview.jpg
          if ! git diff --cached --quiet; then
            git commit -m "Add real-photo contact sheet and source manifest"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pip-82-real-food-photos
          path: |
            previews/PIP_82_Real_Food_Photo_Contact_Sheet.png
            previews/PIP_82_Photo_Sources.json previews/PIP_82_Real_Food_Photo_Contact_Sheet_Preview.jpg
