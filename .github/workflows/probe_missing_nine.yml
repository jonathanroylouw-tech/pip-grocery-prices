name: PIP missing-photo precision probe
on:
  push:
    branches: [pip-food-photos-curated-v2]
    paths:
      - scripts/probe_missing_nine.py
      - .github/workflows/probe_missing_nine.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python scripts/probe_missing_nine.py
